[package]
name = "educator-shell"
description = "Educator desktop application (Tauri 2): commands called by the front, shared state, start-up, logs. Business rules live in the educator-* crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "educator_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
educator-core.workspace = true
educator-content.workspace = true
educator-data.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
uuid.workspace = true
# System voice of the iPad (SUB023805, ADR 0005): the plugin runs on iOS only; elsewhere only its
# models, used by the tests of the adapter (`system_voice.rs`).
tauri-plugin-system-voice = { path = "../../plugins/tauri-plugin-system-voice" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Desktop only: one window per computer (the database is shared), remembered window size and the
# file dialogs of the backup.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# Where the parents save or open a backup of the profiles (SUB001512).
tauri-plugin-dialog = "2"

[dev-dependencies]
# TypeScript types of the commands, written to web/src/api/types.ts by `cargo test` (npm run api:generate).
ts-rs = "11"
tempfile.workspace = true

[lints]
workspace = true
