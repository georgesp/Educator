<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Planche de contrôle des personnages</title>
  <!-- SUB000101 : tous les personnages côte à côte, en 256, 96 et 48 px, pour vérifier l'homogénéité du style.
       Ouvrir ce fichier dans un navigateur depuis content/characters/. -->
  <style>
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #f3f3f5; color: #1a1a1f; }
    h1 { margin: 0 0 24px; font-size: 24px; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    figure { margin: 0; padding: 12px; background: #fff; border-radius: 12px; text-align: center; }
    .small { display: flex; gap: 12px; justify-content: center; align-items: end; margin: 8px 0; }
    figcaption { font-size: 14px; }
  </style>
</head>
<body>
  <h1>Personnages des profils — planche de contrôle</h1>
  <main>
    <figure>
      <img src="lion.svg" width="256" height="256" alt="Lion">
      <div class="small"><img src="lion.svg" width="96" height="96" alt=""><img src="lion.svg" width="48" height="48" alt=""></div>
      <figcaption>Lion <code>lion</code></figcaption>
    </figure>
    <figure>
      <img src="ours.svg" width="256" height="256" alt="Ours">
      <div class="small"><img src="ours.svg" width="96" height="96" alt=""><img src="ours.svg" width="48" height="48" alt=""></div>
      <figcaption>Ours <code>ours</code></figcaption>
    </figure>
    <figure>
      <img src="lapin.svg" width="256" height="256" alt="Lapin">
      <div class="small"><img src="lapin.svg" width="96" height="96" alt=""><img src="lapin.svg" width="48" height="48" alt=""></div>
      <figcaption>Lapin <code>lapin</code></figcaption>
    </figure>
    <figure>
      <img src="renard.svg" width="256" height="256" alt="Renard">
      <div class="small"><img src="renard.svg" width="96" height="96" alt=""><img src="renard.svg" width="48" height="48" alt=""></div>
      <figcaption>Renard <code>renard</code></figcaption>
    </figure>
    <figure>
      <img src="cochon.svg" width="256" height="256" alt="Cochon">
      <div class="small"><img src="cochon.svg" width="96" height="96" alt=""><img src="cochon.svg" width="48" height="48" alt=""></div>
      <figcaption>Cochon <code>cochon</code></figcaption>
    </figure>
    <figure>
      <img src="garcon-court.svg" width="256" height="256" alt="Garçon aux cheveux courts">
      <div class="small"><img src="garcon-court.svg" width="96" height="96" alt=""><img src="garcon-court.svg" width="48" height="48" alt=""></div>

    </figure>
    <figure>

      <figcaption>Garçon aux cheveux bouclés <code>garcon-boucles</code></figcaption>
    </figure>

    </figure>
    <figure>

  </main>
</body>
</html>
